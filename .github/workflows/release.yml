name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish release assets to
        required: true
        type: string
      npm_only:
        description: Retry only npm publishing using the tagged source and this workflow revision's declaration config
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.release_tag || github.ref }}-${{ inputs.npm_only && 'npm' || 'all' }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  verify-binaries:
    if: ${{ !inputs.npm_only }}
    name: Verify binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Configure Go grammar subset
        shell: bash
        run: echo "GOFLAGS=${GOFLAGS:+$GOFLAGS }-tags=$(cat .go-build-tags)" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build:app

      - name: Build native smoke binary
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist-smoke
          version="${RELEASE_TAG#v}"
          output="dist-smoke/tld"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            output="dist-smoke/tld.exe"
          fi
          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/mertcikla/tld/v2/cmd/version.Version=${version}" \
            -o "${output}" \
            ./cmd/tld/main.go
          echo "TLD_BINARY=$(pwd)/${output}" >> "$GITHUB_ENV"
          echo "TLD_EXPECT_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Test self-update replacement on native OS
        run: go test ./internal/selfupdate

      - name: Smoke test native binary
        shell: bash
        run: bash scripts/ci/smoke-binary.sh

  goreleaser:
    if: ${{ !inputs.npm_only }}
    needs: verify-binaries
    runs-on: macos-26
    environment: release
    permissions:
      contents: write
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Configure Go grammar subset
        shell: bash
        run: echo "GOFLAGS=${GOFLAGS:+$GOFLAGS }-tags=$(cat .go-build-tags)" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Import Apple Certificates
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --timeout 90m
        env:
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

      - name: Attest release artifacts provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Save Linux release archive for Docker
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux-release
          path: dist/tld_Linux_x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: bump version to ${{ env.RELEASE_TAG }} [skip ci]"
          branch: main
          file_pattern: 'frontend/package.json frontend/package-lock.json cmd/version/version.go go.mod go.sum'

      - name: Publish @tldiagram/core-ui to npm
        working-directory: frontend
        shell: bash
        run: |
          npm run build
          NPM_TAG=latest
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            NPM_TAG=beta
          fi
          npm publish --access public --tag "$NPM_TAG" --provenance

  docker:
    if: ${{ !inputs.npm_only }}
    needs: goreleaser
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Download Linux release archive
        uses: actions/download-artifact@v4
        with:
          name: cli-linux-release
          path: dist

      - name: Extract standalone Linux release binary for Docker
        run: tar -xzf dist/tld_Linux_x86_64.tar.gz tld

      - name: Build distroless image from release binary
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t tld:ci .

      - name: Publish Docker image to GitHub Container Registry
        id: docker_publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag tld:ci "${image}:${RELEASE_TAG}"
          docker push "${image}:${RELEASE_TAG}"
          if [[ "${RELEASE_TAG}" != *-* ]]; then
            docker tag tld:ci "${image}:latest"
            docker push "${image}:latest"
          fi
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${image}:${RELEASE_TAG}")
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Attest Docker image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.docker_publish.outputs.image }}
          subject-digest: ${{ steps.docker_publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  npm-retry:
    name: Retry npm publish
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_only }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0

      # Keep product source at the existing tag, while allowing declaration-build
      # fixes from the branch used to dispatch this workflow. Do not move the tag.
      - name: Use declaration config from workflow revision
        env:
          BUILD_CONFIG_SHA: ${{ github.workflow_sha }}
        run: git show "${BUILD_CONFIG_SHA}:frontend/tsconfig.lib.json" > frontend/tsconfig.lib.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set npm package version from release tag
        working-directory: frontend
        shell: bash
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build and publish npm package
        working-directory: frontend
        shell: bash
        run: |
          npm run build
          NPM_TAG=latest
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            NPM_TAG=beta
          fi
          npm publish --access public --tag "$NPM_TAG" --provenance
