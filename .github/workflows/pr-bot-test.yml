name: PR bot validation
on:
  push:
    branches: [main]
    paths:
      - action.yml
      - scripts/pr-bot/**
      - .github/workflows/pr-diagram*.yml
      - .github/workflows/pr-bot-test.yml
  pull_request:
    paths:
      - action.yml
      - scripts/pr-bot/**
      - .github/workflows/pr-diagram*.yml
      - .github/workflows/pr-bot-test.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test action helpers
        run: node --test scripts/pr-bot/*.test.mjs
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache: false
      - name: Lint workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint .github/workflows/pr-diagram*.yml .github/workflows/pr-bot-test.yml
